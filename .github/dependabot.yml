# Weekly dependency and action updates, as pull requests into develop (gitflow).
version: 2
updates:
  - package-ecosystem: maven
    directory: /
    target-branch: develop
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
    groups:
      static-analysis:
        patterns:
          - "com.diffplug.spotless:*"
          - "com.google.googlejavaformat:*"
          - "com.puppycrawl.tools:*"
          - "net.sourceforge.pmd:*"
          - "com.github.spotbugs:*"
          - "com.h3xstream.findsecbugs:*"
          - "com.google.errorprone:*"
    ignore:
      # 3.x validates Jackson 3 (tools.jackson) nodes; this project is on Jackson 2.
      # Adopting it is a Jackson migration decision, not a routine bump (census-9w2).
      - dependency-name: "com.networknt:json-schema-validator"
        update-types: ["version-update:semver-major"]
  - package-ecosystem: github-actions
    directory: /
    target-branch: develop
    schedule:
      interval: weekly
  - package-ecosystem: npm
    directory: /
    target-branch: develop
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      documentation:
        patterns:
          - '*'
