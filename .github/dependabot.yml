# Weekly dependency and action updates, as pull requests into develop (gitflow).
version: 2
updates:
  - package-ecosystem: maven
    directory: /
    target-branch: develop
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
    groups:
      static-analysis:
        patterns:
          - "com.diffplug.spotless:*"
          - "com.google.googlejavaformat:*"
          - "com.puppycrawl.tools:*"
          - "net.sourceforge.pmd:*"
          - "com.github.spotbugs:*"
          - "com.h3xstream.findsecbugs:*"
          - "com.google.errorprone:*"
  - package-ecosystem: github-actions
    directory: /
    target-branch: develop
    schedule:
      interval: weekly
  - package-ecosystem: npm
    directory: /
    target-branch: develop
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      documentation:
        patterns:
          - '*'
