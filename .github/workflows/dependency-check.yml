name: Dependency check

# OWASP Dependency-Check against NVD. Too slow for every commit, so: weekly, on integration
# branches, and on demand. Needs repository secret NVD_API_KEY (https://nvd.nist.gov/developers/request-an-api-key).
on:
  schedule:
    - cron: '17 6 * * 1'
  push:
    branches: [main, develop]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  dependency-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
      - name: Cache vulnerability database
        uses: actions/cache@0400d5f644dc74513175e3cd8d07132dd4860809 # v4.2.4
        with:
          path: ~/.m2/repository/org/owasp/dependency-check-data
          key: dependency-check-data-${{ github.run_id }}
          restore-keys: dependency-check-data-
      - name: Scan dependencies (fails on CVSS >= 7)
        env:
          NVD_API_KEY: ${{ secrets.NVD_API_KEY }}
        run: |
          if [ -z "$NVD_API_KEY" ]; then
            echo "::error::Repository secret NVD_API_KEY is not set; see https://nvd.nist.gov/developers/request-an-api-key"
            exit 1
          fi
          ./mvnw -B -ntp -P dependency-check verify -DskipTests -Dinvoker.skip
      - name: Upload report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: dependency-check-report
          path: target/dependency-check-report.*
          if-no-files-found: ignore
