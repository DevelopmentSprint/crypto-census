name: Dependency check

# OWASP Dependency-Check against NVD. Too slow for every commit, so: weekly, on integration
# branches, and on demand. Needs repository secret NVD_API_KEY (https://nvd.nist.gov/developers/request-an-api-key).
on:
  schedule:
    - cron: '17 6 * * 1'
  push:
    branches: [main, develop]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  classify:
    runs-on: ubuntu-latest
    outputs:
      mode: ${{ steps.scope.outputs.mode }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Reject private tracker state
        run: bash scripts/check-private-tracker.sh
      - name: Classify push changes (scheduled and manual scans are always full)
        id: scope
        run: python3 scripts/ci_changes.py event
  dependency-check:
    needs: classify
    if: needs.classify.outputs.mode == 'full'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
      - name: Cache vulnerability database
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.m2/repository/org/owasp/dependency-check-data
          key: dependency-check-data-${{ github.run_id }}
          restore-keys: dependency-check-data-
      - name: Scan dependencies (fails on CVSS >= 7)
        env:
          NVD_API_KEY: ${{ secrets.NVD_API_KEY }}
        run: |
          if [ -z "$NVD_API_KEY" ]; then
            echo "::error::Repository secret NVD_API_KEY is not set; see https://nvd.nist.gov/developers/request-an-api-key"
            exit 1
          fi
          ./mvnw -B -ntp -P dependency-check verify -DskipTests -DskipITs -Dinvoker.skip
      - name: Upload report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dependency-check-report
          path: target/dependency-check-report.*
          if-no-files-found: ignore
