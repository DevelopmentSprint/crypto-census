name: Documentation

on:
  pull_request:
    branches: [develop, main]
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [develop]

permissions:
  contents: read

concurrency:
  # Late CI completions must not cancel a newer source's publication.
  group: docs-${{ github.event_name }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    name: Build and check documentation
    if: >-
      github.event_name == 'pull_request' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'push' &&
       github.event.workflow_run.head_branch == 'develop' &&
       github.event.workflow_run.head_repository.full_name == github.repository)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    outputs:
      current: ${{ steps.source.outputs.current }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Reject stale deployment sources
        id: source
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT: ${{ github.event_name }}
          SOURCE_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          current=true
          if [ "$EVENT" = workflow_run ]; then
            tip=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/develop" --jq .object.sha)
            if [ "$SOURCE_SHA" != "$tip" ]; then current=false; fi
          fi
          echo "current=$current" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        if: steps.source.outputs.current == 'true'
        with:
          node-version: '24'
          cache: npm
      - name: Download exact source coverage
        if: github.event_name == 'workflow_run' && steps.source.outputs.current == 'true'
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: docs-coverage
          path: .docs-coverage
          github-token: ${{ github.token }}
          run-id: ${{ github.event.workflow_run.id }}
      - name: Install locked documentation dependencies
        if: steps.source.outputs.current == 'true'
        run: npm ci
      - name: Check documentation dependencies
        if: steps.source.outputs.current == 'true'
        run: npm audit --audit-level=moderate
      - name: Test coverage provenance and aggregation
        if: steps.source.outputs.current == 'true'
        run: |
          node --test scripts/docs/prepare_test.mjs
          python3 scripts/coverage_badges_test.py
      - name: Type check theme
        if: steps.source.outputs.current == 'true'
        run: npm run docs:typecheck
      - name: Build site and check every internal link
        if: steps.source.outputs.current == 'true'
        env:
          DOCS_COVERAGE_DIR: ${{ github.event_name == 'workflow_run' && '.docs-coverage' || '' }}
          DOCS_SOURCE_SHA: ${{ github.event.workflow_run.head_sha }}
          DOCS_RUN_URL: ${{ github.event.workflow_run.html_url }}
          DOCS_REQUIRE_COVERAGE: ${{ github.event_name == 'workflow_run' }}
        run: npm run docs:build
      - name: Install browser
        if: steps.source.outputs.current == 'true'
        run: npx playwright install --with-deps chromium
      - name: Check diagrams, search and mobile navigation
        if: steps.source.outputs.current == 'true'
        run: npm run docs:test
      - name: Upload browser evidence
        if: always() && steps.source.outputs.current == 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: documentation-browser-evidence
          path: test-results/
          retention-days: 14
          if-no-files-found: ignore
      - name: Upload review site
        if: github.event_name == 'pull_request'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: documentation-preview
          path: docs/.vitepress/dist/
          retention-days: 14
      - name: Package Pages site
        if: github.event_name == 'workflow_run' && steps.source.outputs.current == 'true'
        uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3.0.1
        with:
          path: docs/.vitepress/dist

  deploy:
    name: Publish GitHub Pages
    concurrency:
      group: github-pages
      # Preserve pending deployments; a late stale build must not replace one.
      queue: max
      cancel-in-progress: false
    needs: build
    if: github.event_name == 'workflow_run' && needs.build.outputs.current == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Recheck source before deployment
        id: source
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          tip=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/develop" --jq .object.sha)
          if [ "$SOURCE_SHA" = "$tip" ]; then
            echo "current=true" >> "$GITHUB_OUTPUT"
          else
            echo "Develop advanced; skipping stale site deployment."
            echo "current=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Deploy
        if: steps.source.outputs.current == 'true'
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4.0.5
