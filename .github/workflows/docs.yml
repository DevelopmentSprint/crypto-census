name: Documentation

on:
  pull_request:
    branches: [develop, main]
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [develop]

permissions:
  contents: read

concurrency:
  # Late CI completions must not cancel a newer source's publication.
  group: docs-${{ github.event_name }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    name: Build and check documentation
    if: >-
      github.event_name == 'pull_request' ||
      (github.repository == 'DevelopmentSprint/crypto-census' &&
       github.event.workflow_run.conclusion == 'success' &&
       (github.event.workflow_run.event == 'push' || github.event.workflow_run.event == 'workflow_dispatch') &&
       github.event.workflow_run.head_branch == 'develop' &&
       github.event.workflow_run.head_repository.full_name == github.repository)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    outputs:
      current: ${{ steps.source.outputs.current }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Reject stale deployment sources
        id: source
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT: ${{ github.event_name }}
          SOURCE_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          current=true
          if [ "$EVENT" = workflow_run ]; then
            tip=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/develop" --jq .object.sha)
            if [ "$SOURCE_SHA" != "$tip" ]; then current=false; fi
          fi
          echo "current=$current" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        if: steps.source.outputs.current == 'true'
        with:
          node-version: '24'
          cache: npm
      - name: Select verified evidence producer
        id: evidence
        if: github.event_name == 'workflow_run' && steps.source.outputs.current == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          DOCS_SOURCE_SHA: ${{ github.event.workflow_run.head_sha }}
          DOCS_TRIGGER_RUN_ID: ${{ github.event.workflow_run.id }}
        run: python3 scripts/docs/evidence_source.py select
      - name: Download verified producer coverage
        if: github.event_name == 'workflow_run' && steps.source.outputs.current == 'true'
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          artifact-ids: ${{ steps.evidence.outputs.coverage_id }}
          merge-multiple: true
          path: .docs-coverage
          github-token: ${{ github.token }}
          run-id: ${{ steps.evidence.outputs.run_id }}
      - name: Download verified producer example CBOM
        if: github.event_name == 'workflow_run' && steps.source.outputs.current == 'true'
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          artifact-ids: ${{ steps.evidence.outputs.cbom_id }}
          merge-multiple: true
          path: .docs-cbom
          github-token: ${{ github.token }}
          run-id: ${{ steps.evidence.outputs.run_id }}
      - name: Install locked documentation dependencies
        if: steps.source.outputs.current == 'true'
        run: npm ci
      - name: Check documentation dependencies
        if: steps.source.outputs.current == 'true'
        run: npm audit --audit-level=moderate
      - name: Test coverage provenance and aggregation
        if: steps.source.outputs.current == 'true'
        run: |
          node --test scripts/docs/prepare_test.mjs scripts/docs/analytics_test.mjs
          python3 scripts/coverage_badges_test.py
          python3 -m unittest discover -s scripts/docs -p '*_test.py'
          python3 scripts/ci_changes_test.py
      - name: Type check theme
        if: steps.source.outputs.current == 'true'
        run: npm run docs:typecheck
      - name: Build site and check every internal link
        if: steps.source.outputs.current == 'true'
        env:
          DOCS_GA4_MEASUREMENT_ID: ${{ github.event_name == 'workflow_run' && vars.DOCS_GA4_MEASUREMENT_ID || '' }}
          DOCS_CBOM_DIR: ${{ github.event_name == 'workflow_run' && '.docs-cbom' || '' }}
          DOCS_REQUIRE_CBOM: ${{ github.event_name == 'workflow_run' }}
          DOCS_REPOSITORY: ${{ github.repository }}
          DOCS_RUN_ID: ${{ steps.evidence.outputs.run_id }}
          DOCS_RUN_ATTEMPT: ${{ steps.evidence.outputs.run_attempt }}
          DOCS_COVERAGE_DIR: ${{ github.event_name == 'workflow_run' && '.docs-coverage' || '' }}
          DOCS_SOURCE_SHA: ${{ github.event.workflow_run.head_sha }}
          DOCS_RUN_URL: ${{ steps.evidence.outputs.run_url }}
          DOCS_EVIDENCE_SHA: ${{ steps.evidence.outputs.sha }}
          DOCS_EVIDENCE_PROOF: ${{ github.event_name == 'workflow_run' && '.docs-evidence.json' || '' }}
          DOCS_REQUIRE_COVERAGE: ${{ github.event_name == 'workflow_run' }}
        run: npm run docs:build
      - name: Install browser
        if: steps.source.outputs.current == 'true'
        run: npx playwright install --with-deps chromium
      - name: Check diagrams, search and mobile navigation
        if: steps.source.outputs.current == 'true'
        run: npm run docs:test
      - name: Upload browser evidence
        if: always() && steps.source.outputs.current == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: documentation-browser-evidence
          path: test-results/
          retention-days: 14
          if-no-files-found: ignore
      - name: Upload review site
        if: github.event_name == 'pull_request'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: documentation-preview
          path: docs/.vitepress/dist/
          retention-days: 14
      - name: Package Pages site
        if: github.event_name == 'workflow_run' && steps.source.outputs.current == 'true'
        uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3.0.1
        with:
          path: docs/.vitepress/dist

  deploy:
    name: Publish GitHub Pages
    concurrency:
      group: github-pages
      # Preserve pending deployments; a late stale build must not replace one.
      queue: max
      cancel-in-progress: false
    needs: build
    if: github.event_name == 'workflow_run' && needs.build.outputs.current == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Recheck source before deployment
        id: source
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          tip=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/develop" --jq .object.sha)
          if [ "$SOURCE_SHA" = "$tip" ]; then
            echo "current=true" >> "$GITHUB_OUTPUT"
          else
            echo "Develop advanced; skipping stale site deployment."
            echo "current=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Deploy
        if: steps.source.outputs.current == 'true'
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
