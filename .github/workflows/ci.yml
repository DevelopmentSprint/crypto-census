name: CI

# Gitflow: main holds releases, develop integrates features; release/* and hotfix/* are built too.
on:
  push:
    branches: [main, develop, 'release/**', 'hotfix/**']
  pull_request:
    branches: [main, develop]

# Least privilege: the build only needs to read the repository.
permissions:
  contents: read

jobs:
  build:
    name: JDK ${{ matrix.java }} / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        java: ['17', '21', '25']
    steps:
      # Actions are pinned to full commit SHAs; tags can be moved.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}
          cache: maven
      - name: Build and test (unit, agent ITs, Maven Invoker ITs)
        run: mvn -B -ntp verify
      - name: Upload demo CBOM
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: cbom-jdk${{ matrix.java }}-${{ matrix.os }}
          path: census-demo/target/cryptocensus/cbom.json
          if-no-files-found: ignore
