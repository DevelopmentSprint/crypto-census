name: CI

# Gitflow: main holds releases, develop integrates features; release/* and hotfix/* are built too.
on:
  push:
    branches: [main, develop, 'release/**', 'hotfix/**']
  pull_request:
    branches: [main, develop]

# Least privilege: the build only needs to read the repository.
permissions:
  contents: read

jobs:
  private-tracker:
    name: Private tracker boundary
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - run: bash scripts/check-private-tracker.sh

  # ---------------------------------------------------------------------------------------------
  # Conformance matrix. This list is the single source of truth for "supported": every row is
  # built and tested on each configured CI event; docs/COMPATIBILITY.md and docs/CONFORMANCE.md mirror it.
  # Ratchet rule: rows are only ever added. Removing one requires a deprecation announced in
  # CHANGELOG.md first (see docs/CONFORMANCE.md).
  # ---------------------------------------------------------------------------------------------
  build:
    name: JDK ${{ matrix.java }} ${{ matrix.distribution }} / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Eclipse Temurin (HotSpot) on Linux: every LTS from the bytecode target, plus the
          # current and previous feature releases
          - { os: ubuntu-latest, distribution: temurin, java: '17' }
          - { os: ubuntu-latest, distribution: temurin, java: '21' }
          - { os: ubuntu-latest, distribution: temurin, java: '25' }
          - { os: ubuntu-latest, distribution: temurin, java: '26' }
          - { os: ubuntu-latest, distribution: temurin, java: '27' }
          # Windows: oldest and newest LTS, and the newest release
          - { os: windows-latest, distribution: temurin, java: '17' }
          - { os: windows-latest, distribution: temurin, java: '25' }
          - { os: windows-latest, distribution: temurin, java: '27' }
          # IBM Semeru (OpenJ9 VM, OpenJCEPlus provider): what WebSphere Liberty runs on
          - { os: ubuntu-latest, distribution: semeru, java: '17' }
          - { os: ubuntu-latest, distribution: semeru, java: '21' }
          - { os: ubuntu-latest, distribution: semeru, java: '25' }
    steps:
      # Actions are pinned to full commit SHAs; tags can be moved.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          distribution: ${{ matrix.distribution }}
          java-version: ${{ matrix.java }}
          cache: maven
      # JDK 21+ also runs the "quality" profile: Spotless, Checkstyle, Error Prone, javac -Werror,
      # PMD, CPD, SpotBugs/FindSecBugs and JaCoCo coverage floors. JDK 17 runs tests and Enforcer
      # (the analyzers themselves need JDK 21 to run). Tests include the conformance ITs: the
      # agent in child JVMs of this JDK, next to the OpenTelemetry Java agent and in embedded
      # Tomcat.
      - name: Build, test and analyze
        run: ./mvnw -B -ntp verify
      - name: Upload demo CBOM
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: cbom-jdk${{ matrix.java }}-${{ matrix.distribution }}-${{ matrix.os }}
          path: census-demo/target/cryptocensus/cbom.json
          if-no-files-found: ignore

  # Dogfood the plugin as a consumer, using the current checkout rather than a cached release.
  # The demo's payments tests exercise signing, encryption and checksums in a forked JVM.
  dogfood:
    name: Maven plugin dogfood / runtime CBOM
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      # Tests and static analysis run in the full matrix above. This first invocation only
      # bootstraps the plugin and its dependencies before a separate consumer invocation.
      - name: Install this checkout's Maven plugin and agent
        run: ./mvnw -B -ntp -pl census-maven-plugin -am clean install -DskipTests -Dinvoker.skip=true
      - name: Scan the payments workload with the Maven plugin
        run: ./mvnw -B -ntp -pl census-demo clean verify
      # check writes the merged CBOM before failing a risk policy. Keep that evidence while
      # preserving Maven's failure. Test failures before check may leave only raw JVM reports.
      - name: Require a nonempty cryptographic inventory
        if: always()
        run: |
          jq -e '.bomFormat == "CycloneDX" and any(.components[]; .type == "cryptographic-asset")' \
            census-demo/target/cryptocensus/cbom.json
      - name: Publish merged runtime CBOM
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: crypto-census-cbom
          path: census-demo/target/cryptocensus/cbom.json
          if-no-files-found: error
          retention-days: 14
      - name: Preserve individual JVM reports
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: crypto-census-cbom-jvm-reports
          path: census-demo/target/cryptocensus/*/cbom-*.json
          if-no-files-found: ignore
          retention-days: 14

  # Application servers in containers (Docker is preinstalled on GitHub's Ubuntu runners):
  # Open Liberty on IBM Semeru and WildFly, images pinned by digest in AppServerIT.
  app-servers:
    name: App servers (Open Liberty on Semeru, WildFly) / ubuntu-latest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
      - name: Conformance in Open Liberty and WildFly
        run: ./mvnw -B -ntp -P app-servers -pl census-app-servers -am verify -Dcensus.requireDocker=true
      # A gate must not pass by not running: both app-server tests executed, none skipped.
      - name: Require that every app-server test ran
        run: |
          report=census-app-servers/target/failsafe-reports/TEST-com.developmentsprint.cryptocensus.appservers.AppServerIT.xml
          if ! grep -q 'tests="2"' "$report" || ! grep -q 'skipped="0"' "$report"; then
            echo "::error::AppServerIT did not run both app-server tests"
            head -3 "$report" || true
            exit 1
          fi

  # Early warning, not a gate: the next JDK's early-access build. Expected to fail when it moves
  # past the class file version the bundled Byte Buddy knows (AgentIT then also checks that the
  # agent says so and works with experimental=true). The static analyzers are skipped: they lag
  # behind new JDKs and say nothing about the agent. Bump java-version when that JDK goes GA and
  # joins the matrix above.
  early-access:
    name: JDK 28-ea temurin / ubuntu-latest (advisory)
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          distribution: temurin
          java-version: '28-ea'
          cache: maven
      - name: Build and test without static analysis
        run: ./mvnw -B -ntp verify -P '!quality'
